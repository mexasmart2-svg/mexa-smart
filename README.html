
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MEXA SMART — HTML Registry</title>

  <!-- DESAIN GLOBAL: FILE DIBUAT PADA TAHAP THEMES -->
  <link rel="stylesheet" href="./themes.css">
</head>
<body>

  <main id="mexa-registry">
    <header>
      <h1>MEXA SMART</h1>
      <p>HTML REGISTRY — PENDAFTARAN SISTEM GLOBAL</p>
    </header>

    <section>
      <h2>Daftar dan Jalur Sistem</h2>
      <div id="registry-list"></div>
    </section>

    <p id="registry-status" role="status">
      Menyiapkan Registry...
    </p>
  </main>

  <script>
  (function (window, document) {
    "use strict";

    const manifest = [
      {
        name: "login",
        title: "Tampilan Login",
        file: null,
        position: 0,
        type: "page",
        status: "jalur file perlu dipastikan"
      },
      {
        name: "html-registry",
        title: "HTML Registry",
        file: "./index.html",
        position: 1,
        type: "registry",
        status: "aktif"
      },
      {
        name: "connector-1",
        title: "System Penghubung 1",
        file: "./System penghubung 1",
        position: 2,
        type: "connector",
        destination: "system-center",
        method: "sendRegistration",
        status: "jalur dicatat; kode menyusul"
      },
      {
        name: "system-center",
        title: "System Pusat",
        file: "./mexa-system-center.js",
        position: 3,
        type: "center",
        status: "belum dibuat"
      },
      {
        name: "data-management",
        title: "System Pengelolaan Data",
        file: "./mexa-data-management.js",
        position: 4,
        type: "data-service",
        status: "belum dibuat"
      },
      {
        name: "themes-css",
        title: "Themes CSS",
        file: "./themes.css",
        position: 5,
        type: "stylesheet",
        status: "jalur disiapkan"
      },
      {
        name: "themes-js",
        title: "Themes JS",
        file: "./themes.js",
        position: 6,
        type: "theme-system",
        status: "jalur disiapkan"
      }
    ];

    function copy(record) {
      return { ...record };
    }

    function get(name) {
      const record = manifest.find(
        item => item.name === name
      );

      return record ? copy(record) : null;
    }

    function list() {
      return manifest.map(copy);
    }

    function getConnectorRoute() {
      return {
        file: "./System penghubung 1",
        destination: "system-center",
        method: "sendRegistration"
      };
    }

    const registry = Object.freeze({
      version: "1.0.0",
      get,
      list,
      getConnectorRoute
    });

    window.MEXA_HTML_REGISTRY = registry;

    const container = document.getElementById(
      "registry-list"
    );

    manifest.forEach(record => {
      const card = document.createElement("article");
      card.className = "registry-item";
      card.dataset.system = record.name;

      const title = document.createElement("h3");
      title.textContent =
        record.position === 0
          ? record.title
          : record.position + ". " + record.title;

      const path = document.createElement("p");
      path.textContent =
        "File: " + (record.file || "belum ditentukan");

      const status = document.createElement("p");
      status.textContent = "Status: " + record.status;

      card.append(title, path, status);
      container.appendChild(card);
    });

    document.getElementById("registry-status").textContent =
      "Registry aktif · " + manifest.length +
      " entri tercatat.";

    console.log(
      "[MEXA REGISTRY] Siap:",
      registry.list()
    );
  })(window, document);
  </script>

  <!-- MESIN TEMA AKAN DIBUAT PADA TAHAP BERIKUTNYA -->
  <script src="./themes.js"></script>

</body>
</html>
