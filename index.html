<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="MEXA SMART — Platform sosial modular."
  >
  <meta name="theme-color" content="#0b0818">

  <title>MEXA SMART</title>

  <!-- CSS UTAMA -->
  <link rel="stylesheet" href="./css/mexa-base.css">
  <link rel="stylesheet" href="./css/mexa-themes.css">
  <link rel="stylesheet" href="./css/mexa-responsive.css">
</head>

<body>
  <!-- HEADER -->
  <header class="mx-header">
    <a
      class="mx-brand"
      href="./index.html"
      aria-label="MEXA SMART Home"
    >
      <span class="mx-brand-m">M</span><span class="mx-brand-e"><i></i><i></i><i></i></span><span class="mx-brand-x">X</span><span class="mx-brand-a">A</span>
      <span class="mx-brand-name">MEXA SMART</span>
    </a>

    <div class="mx-header-actions">
      <button
        id="mx-search-button"
        class="mx-icon-button"
        type="button"
        aria-label="Cari"
      >⌕</button>

      <button
        id="mx-notification-button"
        class="mx-icon-button"
        type="button"
        aria-label="Notifikasi"
      >♧</button>

      <button
        id="mx-menu-button"
        class="mx-icon-button"
        type="button"
        aria-label="Menu"
      >☰</button>
    </div>
  </header>

  <!-- STATUS SISTEM -->
  <section class="mx-system-status" aria-live="polite">
    <span class="mx-status-indicator"></span>
    <span id="mexa-system-status">
      MEXA SMART sedang disiapkan...
    </span>
  </section>

  <!-- KONTEN UTAMA -->
  <main class="mx-main">
    <section class="mx-welcome">
      <p class="mx-eyebrow">SOCIAL PLATFORM</p>
      <h1>Selamat datang di MEXA SMART</h1>
      <p>
        Satu platform untuk terhubung, berbagi cerita,
        dan membangun komunitas.
      </p>
    </section>

    <!-- AREA MODUL -->
    <section
      id="mexa-home"
      class="mx-module-area"
      aria-label="Beranda MEXA"
    >
      <div class="mx-panel">
        <h2>Pusat MEXA SMART</h2>
        <p id="mexa-core-message">
          Menyiapkan koneksi dan layanan aplikasi.
        </p>
        <p
          id="mexa-core-error"
          class="mx-error-message"
          role="alert"
          hidden
        ></p>
      </div>
    </section>
  </main>

  <!-- NAVIGASI BAWAH -->
  <nav class="mx-bottom-nav" aria-label="Navigasi utama">
    <a class="mx-nav-item active" href="./index.html">
      <span aria-hidden="true">⌂</span>
      <span>Home</span>
    </a>

    <button class="mx-nav-item" type="button" disabled>
      <span aria-hidden="true">▷</span>
      <span>Reels</span>
    </button>

    <button class="mx-nav-item" type="button" disabled>
      <span aria-hidden="true">＋</span>
      <span>Buat</span>
    </button>

    <button class="mx-nav-item" type="button" disabled>
      <span aria-hidden="true">♧</span>
      <span>Teman</span>
    </button>

    <button class="mx-nav-item" type="button" disabled>
      <span aria-hidden="true">◉</span>
      <span>Profil</span>
    </button>
  </nav>

  <!-- 1. SUPABASE SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 2. KONFIGURASI MEXA SMART -->
  <script src="./config/mexa-config.js"></script>
  <!-- 3. LAYANAN SUPABASE DAN DATA -->
  <script src="./js/services/supabase-client.js"></script>
  <script src="./js/services/auth-service.js"></script>
  <script src="./js/services/database-service.js"></script>
  <script src="./js/services/storage-service.js"></script>
  <script src="./js/services/profile-service.js"></script>
  <!-- 4. SISTEM INTI -->
  <script src="./js/core/mexa-event-bus.js"></script>
  <script src="./js/core/mexa-module-registry.js"></script>
  <script src="./js/core/mexa-error-handler.js"></script>
  <script src="./js/core/mexa-lifecycle.js"></script>
  <script src="./js/core/mexa-smart-core.js"></script>
  <!-- 5. MODUL MEXA SMART -->
  <script src="./js/modules/home/home-module.js"></script>
  <script src="./js/modules/posts/posts-module.js"></script>
  <script src="./js/modules/friends/friends-module.js"></script>
  <script src="./js/modules/profile/profile-module.js"></script>
  <script src="./js/modules/stories/stories-module.js"></script>
  <script src="./js/modules/media/media-module.js"></script>
  <script src="./js/modules/reels/reels-module.js"></script>
  <script src="./js/modules/messenger/messenger-module.js"></script>
  <script src="./js/modules/groups/groups-module.js"></script>
  <script src="./js/modules/notifications/notifications-module.js"></script>
  <script src="./js/modules/mexa-ai/mexa-ai-module.js"></script>
  <!-- 6. PEMULAAN CORE DAN MODUL -->
  <script>
    (function () {
      "use strict";
      const statusElement =
        document.getElementById("mexa-system-status");
      const messageElement =
        document.getElementById("mexa-core-message");
      const errorElement =
        document.getElementById("mexa-core-error");
      function showStatus(message) {
        if (statusElement) {
          statusElement.textContent = message;
        }
      }
      function showMessage(message) {
        if (messageElement) {
          messageElement.textContent = message;
        }
      }
      async function initializeMEXA() {
        try {
          if (!window.MEXA_SMART) {
            throw new Error(
              "File pusat MEXA SMART belum berhasil dimuat."
            );
          }
          await window.MEXA_SMART.start();
          if (!window.MEXA_LIFECYCLE) {
            throw new Error(
              "Sistem pengelola modul belum tersedia."
            );
          }
          const modules = [
            "home",
            "posts",
            "friends",
            "profile",
            "stories",
            "media",
            "reels",
            "messenger",
            "groups",
            "notifications"
          ];
          const results = await Promise.allSettled(
            modules.map(function (name) {
              return window.MEXA_LIFECYCLE.start(name);
            })
          );
          const failed = [];
          results.forEach(function (result, index) {
            if (result.status === "rejected") {
              failed.push(modules[index]);
              console.error(
                "[MEXA SMART] Modul gagal:",
                modules[index],
                result.reason
              );
            }
          });
          if (window.MEXA_AI_MODULE) {
            console.info(
              "[MEXA SMART] Modul MEXA AI tersedia, " +
              "tetapi belum diaktifkan."
            );
          }
          if (failed.length > 0) {
            showStatus(
              "Core aktif, sebagian modul perlu diperiksa."
            );
            showMessage(
              "Modul yang perlu diperiksa: " +
              failed.join(", ")
            );
          } else {
            showStatus(
              "Core aktif. Modul dasar berhasil dimulai."
            );
            showMessage(
              "Fondasi MEXA SMART berhasil dimulai. " +
              "Fitur sosial dan database akan disambungkan bertahap."
            );
          }
          if (errorElement) {
            errorElement.textContent = "";
            errorElement.hidden = true;
          }
          document.documentElement.dataset.mexaReady =
            failed.length === 0 ? "true" : "partial";
        } catch (error) {
          showStatus(
            "MEXA SMART memerlukan pemeriksaan."
          );
          showMessage(
            "Pusat sistem belum dapat dimulai."
          );
          if (errorElement) {
            errorElement.textContent =
              error.message ||
              "Terjadi kesalahan saat menyiapkan MEXA SMART.";
            errorElement.hidden = false;
          }
          document.documentElement.dataset.mexaReady =
            "false";
          console.error("[MEXA SMART]", error);
        }
      }
      initializeMEXA();
    })();
  </script>
</body>
  </html>
