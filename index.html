<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="MEXA SMART — Platform sosial modular."
  >
  <meta name="theme-color" content="#0b0818">

  <title>MEXA SMART</title>

  <!-- CSS UTAMA -->
  <link rel="stylesheet" href="./css/mexa-base.css">
  <link rel="stylesheet" href="./css/mexa-themes.css">
  <link rel="stylesheet" href="./css/mexa-responsive.css">
</head>

<body>
  <!-- HEADER -->
  <header class="mx-header">
    <a
      class="mx-brand"
      href="./index.html"
      aria-label="MEXA SMART Home"
    >
      <span class="mx-brand-m">M</span><span class="mx-brand-e"><i></i><i></i><i></i></span><span class="mx-brand-x">X</span><span class="mx-brand-a">A</span>
      <span class="mx-brand-name">MEXA SMART</span>
    </a>

    <div class="mx-header-actions">
      <button
        id="mx-search-button"
        class="mx-icon-button"
        type="button"
        aria-label="Cari"
      >⌕</button>

      <button
        id="mx-notification-button"
        class="mx-icon-button"
        type="button"
        aria-label="Notifikasi"
      >♧</button>

      <button
        id="mx-menu-button"
        class="mx-icon-button"
        type="button"
        aria-label="Menu"
      >☰</button>
    </div>
  </header>

  <!-- STATUS SISTEM -->
  <section class="mx-system-status" aria-live="polite">
    <span class="mx-status-indicator"></span>
    <span id="mexa-system-status">
      MEXA SMART sedang disiapkan...
    </span>
  </section>

  <!-- KONTEN UTAMA -->
  <main class="mx-main">
    <section class="mx-welcome">
      <p class="mx-eyebrow">SOCIAL PLATFORM</p>
      <h1>Selamat datang di MEXA SMART</h1>
      <p>
        Satu platform untuk terhubung, berbagi cerita,
        dan membangun komunitas.
      </p>
    </section>

    <!-- AREA MODUL -->
    <section
      id="mexa-home"
      class="mx-module-area"
      aria-label="Beranda MEXA"
    >
      <div class="mx-panel">
        <h2>Pusat MEXA SMART</h2>
        <p id="mexa-core-message">
          Menyiapkan koneksi dan layanan aplikasi.
        </p>
        <p
          id="mexa-core-error"
          class="mx-error-message"
          role="alert"
          hidden
        ></p>
      </div>
    </section>
  </main>

  <!-- NAVIGASI BAWAH -->
  <nav class="mx-bottom-nav" aria-label="Navigasi utama">
    <a class="mx-nav-item active" href="./index.html">
      <span aria-hidden="true">⌂</span>
      <span>Home</span>
    </a>

    <button class="mx-nav-item" type="button" disabled>
      <span aria-hidden="true">▷</span>
      <span>Reels</span>
    </button>

    <button class="mx-nav-item" type="button" disabled>
      <span aria-hidden="true">＋</span>
      <span>Buat</span>
    </button>

    <button class="mx-nav-item" type="button" disabled>
      <span aria-hidden="true">♧</span>
      <span>Teman</span>
    </button>

    <button class="mx-nav-item" type="button" disabled>
      <span aria-hidden="true">◉</span>
      <span>Profil</span>
    </button>
  </nav>


<!-- 1. SUPABASE SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. KONFIGURASI -->
<script src="mexa-config.js"></script>

<!-- 3. SERVICES -->
<script src="supabase-client.js"></script>
<script src="auth-service.js"></script>
<script src="database-service.js"></script>
<script src="storage-service.js"></script>
<script src="profile-service.js"></script>

<!-- 4. CORE -->
<script src="mexa-event-bus.js"></script>
<script src="mexa-module-registry.js"></script>
<script src="mexa-error-handler.js"></script>
<script src="mexa-lifecycle.js"></script>
<script src="mexa-smart-core.js"></script>

<!-- 5. MODULES -->
<script src="home-module.js"></script>
<script src="posts-module.js"></script>
<script src="friends-module.js"></script>
<script src="profile-module.js"></script>
<script src="stories-module.js"></script>
<script src="media-module.js"></script>
<script src="reels-module.js"></script>
<script src="messenger-module.js"></script>
<script src="groups-module.js"></script>
<script src="notifications-module.js"></script>
<script src="mexa-ai-module.js"></script>
</body>
</html>
